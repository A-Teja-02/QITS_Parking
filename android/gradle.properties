# Low-memory settings (~7–8GB RAM: Android Studio + Gradle + Kotlin)
# Metaspace must fit the Kotlin compiler too, since it runs in-process (below).
org.gradle.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=640m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.workers.max=1

# Run Kotlin compiler inside Gradle (avoids crashing Kotlin daemon)
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=192m
kotlin.incremental=false

android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
android.enableJetifier=false

# Website loaded by the app. For phone testing on the same Wi-Fi as the PC running
# run_all.bat, use the PC's IP and the Vite port, e.g. http://192.168.1.20:5173
parkingWebUrl=https://parkingapp.quadrantitservices.com
